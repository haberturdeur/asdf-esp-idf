name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh unzip
      - name: Check shell syntax
        run: |
          for script in bin/* lib/*.bash; do
            bash -n "$script"
          done
      - name: Run offline regression tests
        run: python3 -B -m unittest discover -s tests -v
